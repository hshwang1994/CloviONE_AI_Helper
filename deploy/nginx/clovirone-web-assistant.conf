# ClovirONE Web Assistant nginx vhost (spec §27.2).
# Precheck confirmed no existing 80/443 server blocks → IP-literal listen is safe.
# Never marked default_server; existing vhosts are untouched.

server {
    listen 10.100.64.71:80;
    server_name clovirone-ai.gooddi.lab;
    # 80 -> HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 10.100.64.71:443 ssl;
    server_name clovirone-ai.gooddi.lab;

    ssl_certificate     /etc/clovirone-web-assistant/tls/clovirone-ai.gooddi.lab.crt;
    ssl_certificate_key /etc/clovirone-web-assistant/tls/clovirone-ai.gooddi.lab.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Self-signed PoC cert → HSTS intentionally NOT enabled (spec §27.1).

    client_max_body_size 256k;

    # Security headers (defense in depth; app also sets CSP).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Cache-Control은 앱이 경로별로 설정한다: SPA 진입 HTML(index.html)=no-store,
        # 해시된 자산(JS/CSS/이미지)=public,max-age=3600. nginx는 덮어쓰지 말고 그대로
        # 통과시킨다. 예전엔 여기서 `expires 1h; add_header Cache-Control "..."`로 index.html까지
        # 1시간 캐시를 강제해, 앱이 no-store로 내보내도 브라우저가 옛 셸을 붙들어 자산 해시가
        # 바뀌어도 옛 번들만 로드했다("배포해도 안 바뀐다"). 그 강제 캐시 두 줄을 제거했다.
    }

    # Chat messages may carry base64 image attachments — this route alone gets a
    # larger cap (app middleware enforces the same 8m, defense in depth).
    location ~ ^/api/conversations/[^/]+/messages$ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 자유게시판 첨부 업로드(이미지/PDF, 최대 10MB) — 이 라우트만 큰 본문을 허용한다
    # (앱 미들웨어도 같은 12m를 강제, 방어 이중화). 없으면 256k 서버 기본값에 걸려 실제
    # 사진/PDF가 전부 413으로 거부된다.
    location ~ ^/api/board/posts/[^/]+/attachments$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 티켓 첨부 업로드(이미지/PDF, 최대 10MB) — 지시서 §4. 앱 미들웨어도 같은 12m를
    # 강제한다(방어 이중화, app/core/middleware.py _UPLOAD_ROUTE_RES).
    location ~ ^/api/tickets/[^/]+/attachments$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 팀 채팅에 붙여넣는 이미지(최대 10MB). 이 예외가 없어서 256k 서버 기본값에 걸려
    # 화면 캡처가 전부 413으로 거부되고 있었다 — 앱 쪽 상한과 함께 고쳤다.
    location ~ ^/api/team-chat/rooms/[^/]+/images$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 프로필 사진 교체(최대 10MB).
    location ~ ^/api/me/avatar$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
