# ClovirAssist nginx vhost (spec §27.2).
# Precheck confirmed no existing 80/443 server blocks → IP-literal listen is safe.
# Never marked default_server; existing vhosts are untouched.
#
# ⚠️ 이 파일은 **템플릿**이다. `__BIND_IP__` 와 `__DNS_NAME__` 은 설치 스크립트
# (deploy/install.sh)가 설치처 값으로 치환한다.
# 예전엔 최초 고객사의 IP·호스트명이 그대로 박혀 있어서, 다른 곳에 설치하면 nginx 가
# 없는 주소에 바인딩하려다 조용히 실패하거나 남의 이름으로 응답했다.
# 손으로 복사해 쓰면 nginx -t 가 치환되지 않은 자리에서 바로 실패한다 - 그게 의도다.

# ── 요청 속도 제한 존 (P6) ────────────────────────────────────────────────────
# `limit_req_zone` 은 http 컨텍스트에만 놓을 수 있다. 이 파일은 sites-enabled 를 통해
# nginx.conf 의 http {} 안으로 include 되므로 여기가 그 자리다. 존을 **정의만 해서는
# 아무 요청도 제한되지 않는다** - 아래 location 의 `limit_req` 가 거는 곳에서만 효력이 있다.
# 그래서 같은 서버의 다른 vhost 에는 아무 영향이 없다.
#
# ⚠️ 속도 제한은 잘못 걸면 **정상 사용자가 429 를 받는다.** 그래서 값을 추측으로 정하지
# 않고 이 앱이 실제로 보내는 폴링 주기에서 계산했다(frontend/src 의 refetchInterval).
#
#   로그인 후 어느 화면에나 늘 도는 폴링(앱 껍데기):
#     team-chat-rooms      30초  = 2.0회/분   (AppShell.jsx)
#     noti-unread          60초  = 1.0회/분   (NotificationBell.jsx, 사이드바와 키 공유)
#     impersonation-state  60초  = 1.0회/분   (Banners.jsx)
#     system-status       120초  = 0.5회/분   (Banners.jsx, 서버가 주기를 바꿀 수 있다)
#     announcements       300초  = 0.2회/분   (Banners.jsx)
#                                 -------------
#                                  4.7회/분  = 0.078회/초
#   가장 무거운 화면(게임 방)은 여기에 1.2초 폴링이 더 붙는다: 50회/분.
#     => 한 사용자의 최악 지속 속도 = 54.7회/분 = **0.91회/초**
#
# 아래 20r/s 는 그 최악값의 22배다. 한 사람이 탭을 여러 개 열어도, 화면을 빠르게
# 오가도 걸리지 않는다. 대신 스크립트가 도는 폭주(초당 수백 회)는 여기서 끊긴다.
# 이것은 DDoS 방어가 아니다 - 한 클라이언트의 폭주가 워커 1개짜리 앱을 통째로
# 막는 것을 늦추는 장치다(동시성 한계는 docs/NGINX_AND_CAPACITY.md 에 숫자로 있다).
limit_req_zone $binary_remote_addr zone=clv_api:10m rate=20r/s;
#
# 로그인은 따로 본다. 실패 한 번마다 Argon2id 해시 한 번이 돌아 CPU 와 스레드 슬롯을
# 먹기 때문이다. 다만 **앱의 리미터(분당 10회, app/main.py login_ratelimiter)보다
# 느슨하게** 잡는다: 조이면 사용자가 앱의 한국어 안내 대신 nginx 의 맨 429 를 받게 되고,
# 무엇이 잘못됐는지 화면에서 알 수 없다. 앱이 먼저 말하고, nginx 는 그 뒤를 받친다.
limit_req_zone $binary_remote_addr zone=clv_login:10m rate=30r/m;
#
# ⚠️ `limit_req_status` 와 `limit_req_log_level` 은 여기(http)에 두지 않는다. 여기 두면
# 같은 서버의 **다른 vhost** 가 쓰는 속도 제한의 응답 코드까지 바꾼다. 이 파일은 기존
# vhost 를 건드리지 않기로 돼 있다. 그래서 아래 server 블록 안에 둔다.

server {
    listen __BIND_IP__:80;
    server_name __DNS_NAME__;
    # 80 -> HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen __BIND_IP__:443 ssl;
    server_name __DNS_NAME__;

    ssl_certificate     /etc/clovirassist/tls/__DNS_NAME__.crt;
    ssl_certificate_key /etc/clovirassist/tls/__DNS_NAME__.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Self-signed PoC cert → HSTS intentionally NOT enabled (spec §27.1).

    client_max_body_size 256k;

    # Security headers (defense in depth; app also sets CSP).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # ── 이 vhost 전용 로그 (P6) ───────────────────────────────────────────────
    # 기본값(/var/log/nginx/access.log)에 두면 같은 서버의 다른 vhost 요청과 한 파일에 섞인다.
    # 장애를 볼 때 "우리 요청만" 골라내지 못하면 로그가 있어도 못 읽는다.
    # 회전은 배포판 nginx 의 logrotate 설정이 /var/log/nginx/*.log 로 이미 가져간다.
    # 그 설정이 없는 시스템에만 설치 스크립트가 deploy/nginx/logrotate-clovirassist
    # 를 넣는다(둘 다 있으면 logrotate 가 "duplicate log entry" 로 통째로 실패한다).
    access_log /var/log/nginx/clovirassist.access.log combined;
    error_log  /var/log/nginx/clovirassist.error.log warn;

    # 속도 제한에 걸렸을 때의 응답 코드. 기본값은 503(서버 과부하)이라, 로그에서 진짜
    # 과부하와 속도 제한을 구분할 수 없다. 이 vhost 안에서만 바꾼다.
    limit_req_status 429;
    limit_req_log_level warn;

    # ── gzip (P6) ────────────────────────────────────────────────────────────
    # 측정값(scripts 로 잰 실제 번들, gzip level 5):
    #   초기 진입 JS 5개  757,837 B (740 KiB) -> 240,309 B (235 KiB)   68.3% 감소
    #   CSS 까지 합치면   812,710 B (794 KiB) -> 251,044 B (245 KiB)   69.1% 감소
    # 사내 1Gbps LAN 이라 시간 차이는 크지 않지만, VPN 과 원격지에서는 그대로 체감된다.
    #
    # ⚠️ `gzip_proxied` 를 빼면 안 된다. 이 vhost 의 본문은 전부 proxy_pass 로 오는데
    # nginx 의 기본값은 `off` 라, gzip on 만 켜 두면 **아무것도 압축되지 않는다.**
    # 그런 상태는 아무 오류도 안 내고 그냥 조용히 안 듣는다.
    #
    # BREACH(압축 + TLS)를 왜 걱정하지 않는가: 이 공격은 공격자가 넣은 문자열과 비밀이
    # **같은 응답 본문**에 함께 담겨야 성립한다. 여기 비밀은 세션 쿠키(httponly, 헤더라
    # gzip 대상이 아니다)와 CSRF 토큰인데, 세션 쿠키가 SameSite=Strict 라 다른 사이트에서
    # 띄운 요청에는 아예 붙지 않는다. 즉 공격자가 인증된 응답을 만들어 낼 수 없다.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    # 이보다 작은 본문은 압축해도 이득이 없고(헤더 오버헤드), CPU 만 쓴다.
    gzip_min_length 1024;
    # text/html 은 nginx 가 항상 포함하므로 여기 적으면 안 된다(적으면 경고가 뜬다).
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location /static/ {
        # ⚠️ 여기에는 limit_req 를 **일부러 걸지 않는다.** 첫 화면 한 번에 이 경로로만
        # JS 5개 + CSS 1개 + 파비콘/매니페스트 4개가 거의 동시에 나간다. 이 묶음을 속도
        # 제한에 넣으면 새로고침 한 번에 자산 몇 개가 429 로 떨어지고, 화면은 "고장난 것처럼"
        # 보이는데 서버 로그에는 아무 오류도 없다. 정적 자산은 앱 로직을 태우지 않으므로
        # 제한해서 얻는 것도 없다.
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Cache-Control은 앱이 경로별로 설정한다: SPA 진입 HTML(index.html)=no-store,
        # 해시된 자산(JS/CSS/이미지)=public,max-age=3600. nginx는 덮어쓰지 말고 그대로
        # 통과시킨다. 예전엔 여기서 `expires 1h; add_header Cache-Control "..."`로 index.html까지
        # 1시간 캐시를 강제해, 앱이 no-store로 내보내도 브라우저가 옛 셸을 붙들어 자산 해시가
        # 바뀌어도 옛 번들만 로드했다("배포해도 안 바뀐다"). 그 강제 캐시 두 줄을 제거했다.
    }

    # Chat messages may carry base64 image attachments — this route alone gets a
    # larger cap (app middleware enforces the same 8m, defense in depth).
    location ~ ^/api/conversations/[^/]+/messages$ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 자유게시판 첨부 업로드(이미지/PDF, 최대 10MB) — 이 라우트만 큰 본문을 허용한다
    # (앱 미들웨어도 같은 12m를 강제, 방어 이중화). 없으면 256k 서버 기본값에 걸려 실제
    # 사진/PDF가 전부 413으로 거부된다.
    location ~ ^/api/board/posts/[^/]+/attachments$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 티켓 첨부 업로드(이미지/PDF, 최대 10MB) — 지시서 §4. 앱 미들웨어도 같은 12m를
    # 강제한다(방어 이중화, app/core/middleware.py _UPLOAD_ROUTE_RES).
    location ~ ^/api/tickets/[^/]+/attachments$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 팀 채팅에 붙여넣는 이미지(최대 10MB). 이 예외가 없어서 256k 서버 기본값에 걸려
    # 화면 캡처가 전부 413으로 거부되고 있었다 — 앱 쪽 상한과 함께 고쳤다.
    location ~ ^/api/team-chat/rooms/[^/]+/images$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 프로필 사진 교체(최대 10MB).
    location ~ ^/api/me/avatar$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 지식 문서 첨부(S8, 최대 10MB).
    location ~ ^/api/knowledge/documents/[^/]+/attachments$ {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 로그인과 비밀번호 변경만 따로 뺀다(둘 다 Argon2id 를 돌린다). 정확 일치라 접두사
    # location / 보다 먼저 잡힌다. burst=10 nodelay: 사람이 비밀번호를 열 번 연달아 틀리는
    # 일은 있어도, 그보다 빨리 보내는 것은 사람이 아니다.
    # 첨부 업로드 경로들은 별도 location 이라 여기 제한을 물려받지 않는다(의도한 것이다 -
    # 10MB 업로드가 속도 제한에 걸려 중간에 끊기면 원인을 찾기 어렵다).
    location = /login {
        limit_req zone=clv_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location = /change-password {
        limit_req zone=clv_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / {
        # burst=40 nodelay 인 이유: 화면을 한 번 옮길 때 앱이 API 를 여덟 개 안팎 동시에
        # 부른다. 20r/s 를 그 순간에 그대로 적용하면 정상 이동이 429 가 된다. nodelay 는
        # 버스트를 지연시키지 않고 바로 통과시키고, 지속 속도만 20r/s 로 묶는다.
        # 값을 조이거나 풀려면 docs/NGINX_AND_CAPACITY.md 의 근거를 먼저 읽어라.
        limit_req zone=clv_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }
}
