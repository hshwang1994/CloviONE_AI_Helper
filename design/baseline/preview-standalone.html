.comment-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.admin-health { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
.health-card { padding:16px; }
.health-top { display:flex; align-items:center; justify-content:space-between; }
.health-value { font-size:24px; font-weight:760; margin:12px 0 2px; }
.mini-chart { height:52px; margin-top:10px; }
.mini-chart svg { width:100%; height:100%; }
.scope-bar { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:16px; }

.settings-grid { display:grid; grid-template-columns:250px minmax(0,1fr); gap:16px; }

.settings-nav button { width:100%; border:0; background:transparent; text-align:left; padding:10px 11px; border-radius:9px; cursor:pointer; color:var(--muted); }
.settings-nav button.is-on { background:var(--primary-soft); color:var(--primary-strong); font-weight:700; }
.setting-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:18px; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); }
.setting-row:last-child { border-bottom:0; }
.switch { width:46px; height:26px; border:0; border-radius:999px; background:var(--surface-3); padding:3px; cursor:pointer; }
.switch:before { content:""; display:block; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:var(--shadow-sm); transition:transform .18s ease; }
.switch.is-on { background:var(--primary); }
.switch.is-on:before { transform:translateX(20px); }
.palette { display:flex; gap:8px; }
.palette span { width:28px; height:28px; border-radius:8px; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--border); }
.command-backdrop, .drawer-backdrop { position:fixed; inset:0; z-index:300; background:rgba(4,8,20,.56); backdrop-filter:blur(3px); display:grid; place-items:start center; padding-top:10vh; }
.command { width:min(680px,calc(100vw - 30px)); max-height:72vh; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow-lg); }
.command-input { padding:14px; border-bottom:1px solid var(--border); }
.command-input input { width:100%; border:0; background:transparent; color:var(--text); font-size:17px; outline:0; }
.command-list { max-height:55vh; overflow:auto; padding:8px; }
.command-group { color:var(--muted); font-size:11px; font-weight:700; padding:8px 10px 4px; text-transform:uppercase; letter-spacing:.06em; }
.command-item { width:100%; border:0; background:transparent; color:var(--text); border-radius:10px; padding:10px; display:flex; align-items:center; gap:10px; text-align:left; cursor:pointer; }
.command-item:hover, .command-item.is-on { background:var(--primary-soft); }
.mobile-ai-btn { display:none; }
.mobile-ai-btn img { width:28px; height:28px; object-fit:contain; }
.ai-fab { position:fixed; right:24px; bottom:24px; z-index:90; width:64px; height:64px; border-radius:22px; border:1px solid var(--border); background:var(--surface); box-shadow:var(--shadow-md); cursor:pointer; padding:4px; overflow:hidden; }
.ai-fab:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }
.ai-fab img { width:100%; height:100%; object-fit:contain; }
.ai-fab .unread { position:absolute; right:4px; top:4px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; display:grid; place-items:center; background:var(--danger); color:#fff; font-size:10px; font-weight:800; }
.ai-drawer { position:fixed; right:0; top:0; bottom:0; z-index:320; width:min(460px,100vw); background:var(--surface); border-left:1px solid var(--border); box-shadow:var(--shadow-lg); display:grid; grid-template-rows:auto auto 1fr auto; }
.drawer-head { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); }
.drawer-head img { width:42px; height:42px; object-fit:contain; }
.drawer-head .grow { flex:1; }
.drawer-context { padding:10px 16px; background:var(--info-bg); color:var(--info); font-size:12px; }
.drawer-messages { overflow:auto; padding:16px; }
.state-page { min-height:calc(100vh - var(--topbar-h) - 120px); display:grid; place-items:center; text-align:center; }
.state-card { max-width:560px; padding:34px; }
.state-card img { max-width:230px; max-height:210px; object-fit:contain; }
.state-card h1 { margin:18px 0 8px; }
.state-card p { color:var(--muted); }
.skeleton { background:linear-gradient(90deg,var(--surface-3),color-mix(in srgb,var(--surface-3) 55%,var(--surface)),var(--surface-3)); background-size:200% 100%; animation:shimmer 1.2s infinite; border-radius:8px; }
@keyframes shimmer { to { background-position:-200% 0; } }
.login-page { min-height:100vh; display:grid; grid-template-columns:minmax(0,1.15fr) minmax(420px,.85fr); background:var(--bg); }
.login-visual { position:relative; overflow:hidden; background:linear-gradient(145deg,#121a38,#344a9f 52%,#765fc7); color:#fff; padding:clamp(30px,5vw,70px); display:grid; grid-template-rows:auto auto 1fr; }
.login-visual:before { content:""; position:absolute; inset:0; background:url('./assets/e47d73dd48935fab.png') center/cover; opacity:.16; }
.login-brand-lockup { position:relative; z-index:2; display:flex; align-items:center; gap:10px; width:max-content; }
.login-brand-lockup img { width:34px; height:34px; }
.login-brand-lockup span { display:flex; flex-direction:column; line-height:1.08; }
.login-brand-lockup strong { font-size:18px; }
.login-brand-lockup small { margin-top:4px; font-size:10px; color:rgba(255,255,255,.78); }
.login-copy { position:relative; z-index:2; margin-top:clamp(34px,6vh,72px); max-width:690px; }
.login-copy h1 { font-size:clamp(36px,4.2vw,58px); line-height:1.1; letter-spacing:-2px; margin:0 0 14px; }
.login-copy p { font-size:clamp(16px,1.6vw,21px); color:rgba(255,255,255,.82); margin:0; }
.login-mascot { position:relative; justify-self:end; align-self:end; width:min(58%,520px); max-height:54vh; object-fit:contain; object-position:right bottom; z-index:1; pointer-events:none; margin-right:-2%; margin-bottom:-6%; }
.login-form-wrap { display:grid; place-items:center; padding:40px clamp(24px,5vw,72px); background:var(--surface); }
.login-form { width:min(420px,100%); }
.login-form-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.login-form h2 { font-size:30px; margin:0 0 6px; }
.login-theme-btn { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
.login-form .lead { color:var(--muted); margin:0 0 28px; }
.login-form .form-field { margin-bottom:15px; }
.login-form .btn { width:100%; min-height:48px; margin-top:4px; }
.login-foot { margin-top:20px; font-size:12px; color:var(--muted); text-align:center; }
.fixture-banner { display:flex; align-items:center; justify-content:center; gap:8px; min-height:30px; background:#fff3cd; color:#674d00; border-bottom:1px solid #ffe69c; font-size:12px; padding:4px 12px; }
[data-theme="dark"] .fixture-banner { background:#3d3214; color:#ffe69c; border-color:#6f5a18; }
.mobile-menu-btn { display:none; }
.mobile-side-backdrop { display:none; }
@media (max-width: 1200px) {
  .grid.kpi { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .grid.two { grid-template-columns:1fr; }
  .admin-health { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .doc-grid, .game-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width: 960px) {
  :root { --sidebar-w: 248px; }
  .mobile-menu-btn { display:inline-grid; }
  .layout { grid-template-columns:1fr; }
  .sidebar { position:fixed; left:0; top:var(--topbar-h); bottom:0; z-index:150; width:min(var(--sidebar-w),86vw); height:auto; transform:translateX(-105%); transition:transform .2s ease; box-shadow:var(--shadow-lg); }
  .sidebar.is-open { transform:none; }
  .mobile-side-backdrop { display:block; position:fixed; inset:var(--topbar-h) 0 0; z-index:140; background:rgba(0,0,0,.5); }
  .top-search { max-width:none; }
  .top-search .kbd { display:none; }
  .top-search input { padding-right:12px; }
  .brand { min-width:auto; }
  .brand-sub, .user-btn .name { display:none; }
  .ticket-layout, .settings-grid { grid-template-columns:1fr; }
  .settings-nav { position:static; display:flex; overflow:auto; }
  .settings-nav button { width:auto; white-space:nowrap; }
  .chat-shell, .ai-layout { grid-template-columns:1fr; }
  .chat-side, .ai-conversations { display:none; }
  .login-page { grid-template-columns:1fr; }
  .login-visual { min-height:520px; padding:32px; }
  .login-copy { margin-top:28px; max-width:100%; }
  .login-copy h1 { font-size:clamp(32px,7vw,50px); }
  .login-mascot { width:min(72%,480px); max-height:300px; margin:0 -4% -9% 0; }
  .ai-fab { display:none; }
  .mobile-ai-btn { display:inline-grid; place-items:center; }
}
@media (max-width: 720px) {
  .topbar { padding:0 10px; gap:8px; }
  .brand-name { font-size:16px; }
  .brand img { width:26px; height:26px; }
  .top-search { display:none; }
  .content { padding:20px 14px 72px; }
  .page-head { flex-direction:column; }
  .page-actions { justify-content:flex-start; width:100%; }
  .page-actions .btn { flex:1 1 auto; }
  .grid.kpi, .grid.three, .doc-grid, .game-grid, .admin-health, .form-grid { grid-template-columns:1fr; }
  .quick-grid { grid-template-columns:1fr 1fr; }
  .toolbar { align-items:stretch; }
  .toolbar > * { flex:1 1 100%; width:100%!important; }
  .table-wrap { border:0; background:transparent; overflow:visible; }
  table.responsive { min-width:0; display:block; }
  table.responsive thead { display:none; }
  table.responsive tbody { display:grid; gap:10px; }
  table.responsive tr { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px; border:1px solid var(--border); border-radius:14px; background:var(--surface); }
  table.responsive td { display:block; padding:0; border:0; min-width:0; }
  table.responsive td[data-label]:before { content:attr(data-label); display:block; color:var(--muted); font-size:10px; margin-bottom:2px; }
  table.responsive td.wide { grid-column:1/-1; }
  .kanban { grid-template-columns:repeat(4,82vw); }
  .chat-shell { min-height:calc(100vh - var(--topbar-h) - 40px); border-radius:0; border-left:0; border-right:0; }
  .msg { max-width:90%; }
  .board-row { grid-template-columns:1fr auto; }
  .board-row > :nth-child(3), .board-row > :nth-child(4), .board-row > :nth-child(5) { display:none; }
  .scope-bar { align-items:stretch; flex-direction:column; }
  .scope-bar strong { margin-right:0; }
  .login-visual { min-height:500px; padding:26px 24px; }
  .login-copy { max-width:100%; margin-top:26px; }
  .login-copy h1 { font-size:34px; line-height:1.12; }
  .login-copy p { font-size:14px; max-width:72%; }
  .login-mascot { width:280px; max-height:250px; margin:2px -32px -30px 0; }
  .login-form-wrap { padding:34px 20px; }
}
@media (max-width: 430px) {
  .notification-btn { display:none; }
  .user-btn { padding-right:5px; }
  .quick-grid { grid-template-columns:1fr; }
  .login-copy { max-width:100%; }
  .login-copy h1 { font-size:31px; }
  .login-mascot { width:255px; max-height:225px; opacity:1; }
}
@media (prefers-reduced-motion: reduce) {
  .sidebar, .switch:before { transition:none; }
  .quick-action:hover, .ai-fab:hover { transform:none; }
  .skeleton { animation:none; }
}
@media print {
  .topbar, .sidebar, .ai-fab, .fixture-banner, .page-actions, .toolbar { display:none!important; }
  .layout { display:block; }
  .content { max-width:none; padding:0; }
  .card { box-shadow:none; }
}

/* ===== 2026-07-31 full rebuild: canonical login + unified product chrome ===== */
:root {
  --brand-accent: #536CD6;

  --brand-purple: #8E75E1;
  --brand-mint: #62C7BD;
}
.topbar {
  background:
    radial-gradient(circle at 78% -120%, color-mix(in srgb, var(--brand-purple) 74%, transparent), transparent 44%),
    linear-gradient(112deg, var(--brand-deep) 0%, var(--brand-mid) 48%, var(--brand-accent) 100%);
}
.sidebar { background: linear-gradient(180deg, #111936 0%, #0A1026 100%); }
.side-user-switch button.is-on { color: var(--brand-mid); }
.nav-item.is-active {
  background: linear-gradient(90deg, color-mix(in srgb, var(--brand-accent) 42%, transparent), color-mix(in srgb, var(--brand-purple) 16%, transparent));
}
.top-clovi-btn {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 3px 10px 3px 4px;
  border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: rgba(8,14,42,.22); color: #fff; cursor: pointer;
}
.top-clovi-btn:hover { background: rgba(255,255,255,.16); }

.top-clovi-btn span { font-size: 12px; font-weight: 750; }
.top-clovi-btn i { position: absolute; right: -3px; top: -4px; min-width: 18px; height: 18px; padding: 0 4px; display: grid; place-items: center; border-radius: 999px; background: #F25F72; color:#fff; font-style:normal; font-size:10px; font-weight:800; border:2px solid var(--brand-mid); }
.sidebar-clovi {
  width: calc(100% - 12px); margin: 18px 6px 4px; display: grid; grid-template-columns: 48px minmax(0,1fr) auto; align-items: center; gap: 10px;
  padding: 9px 10px; border: 1px solid rgba(255,255,255,.11); border-radius: 15px; background: linear-gradient(135deg,rgba(117,138,225,.18),rgba(142,117,225,.08)); color: var(--sidebar-text); text-align:left; cursor:pointer;
}

.ai-fab { width:70px; height:70px; border-radius:23px; padding:6px; background:rgba(255,255,255,.96); border:1px solid color-mix(in srgb,var(--brand-accent) 28%,var(--border)); }
.ai-fab img { border-radius:17px; }
.drawer-head img { width:48px; height:48px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; }
.drawer-clovi-hero { display:grid; grid-template-columns:118px minmax(0,1fr); align-items:center; gap:14px; padding:14px; border:1px solid var(--border); border-radius:16px; background:linear-gradient(135deg,color-mix(in srgb,var(--brand-accent) 10%,var(--surface)),var(--surface)); }

.state-clovi { width:132px!important; height:132px; object-fit:contain; margin:0 auto 8px; background:linear-gradient(145deg,var(--surface-2),color-mix(in srgb,var(--brand-accent) 9%,var(--surface))); border:1px solid var(--border); border-radius:30px; }

.notification-list { padding-top:4px!important; padding-bottom:4px!important; }

.custom-color .field { width:130px; }

/* Previous approved login is the immutable visual baseline. */
.auth-page {
  min-height:100svh; display:grid; place-items:center; padding:24px; color:#333B55; font-family:var(--font);
  background:radial-gradient(circle at 10% 0%,rgba(142,117,225,.17),transparent 32%),radial-gradient(circle at 100% 100%,rgba(83,108,214,.18),transparent 35%),#F3F6FF;
}
.auth-shell {
  display:grid; grid-template-columns:minmax(0,1.25fr) minmax(420px,.75fr); width:min(100%,clamp(1500px,82vw,1920px)); height:min(calc(100svh - 48px),clamp(840px,92svh,1200px)); min-height:680px; max-width:1920px; margin:0 auto; overflow:hidden; border:1px solid rgba(97,117,190,.16); border-radius:28px; background:#fff; box-shadow:0 28px 80px rgba(43,62,133,.16);
}
.auth-hero { position:relative; display:flex; min-height:0; flex-direction:column; overflow:hidden; padding:48px; color:#fff; background:radial-gradient(circle at 82% 24%,rgba(142,117,225,.58),transparent 32%),radial-gradient(circle at 18% 78%,rgba(98,199,189,.24),transparent 28%),linear-gradient(145deg,#17204D 0%,#293B8D 48%,#536CD6 100%); }
.auth-hero:before { position:absolute; inset:0; content:""; opacity:.13; background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px); background-size:72px 72px; -webkit-mask-image:radial-gradient(circle at center,#000 15%,transparent 76%); mask-image:radial-gradient(circle at center,#000 15%,transparent 76%); pointer-events:none; }

.auth-orb-one { top:12%; right:5%; background:#8E75E1; }.auth-orb-two { bottom:2%; left:-8%; width:320px; background:#62C7BD; }
.auth-logo { position:relative; z-index:3; width:min(285px,42%); height:58px; object-fit:contain; object-position:left center; }
.auth-copy { position:relative; z-index:3; max-width:700px; margin-top:clamp(34px,5.5vh,58px); }
.auth-eyebrow { margin:0 0 16px; color:#E3E7FF; font-size:13px; font-weight:800; letter-spacing:.12em; }
.auth-copy h1 { margin:0; color:#fff; max-width:720px; font-size:clamp(38px,3.7vw,56px); font-weight:820; line-height:1.13; letter-spacing:-.055em; }
.auth-copy h1 strong { color:#D8D0FF; font-weight:inherit; }
.auth-description { max-width:610px; margin:20px 0 0; color:rgba(255,255,255,.82); font-size:15.5px; line-height:1.7; }
.auth-features { display:grid; gap:10px; margin:20px 0 0; padding:0; list-style:none; }

.auth-features span { display:grid; width:32px; height:32px; place-items:center; border:1px solid rgba(255,255,255,.16); border-radius:9px; background:rgba(255,255,255,.13); }
.auth-visual { position:relative; z-index:1; flex:1; min-height:230px; }
.auth-clovi-stage { --eye-x:0px;--eye-y:0px; position:absolute; right:-4%; bottom:-18%; width:64%; max-width:700px; aspect-ratio:1; contain:layout paint; pointer-events:none; }
.auth-clovi-base,.auth-clovi-eyes { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
.auth-clovi-eyes { transform:translate3d(var(--eye-x),var(--eye-y),0); transition:transform 95ms linear,opacity 150ms ease,filter 150ms ease; }

/* ===== 2026-07 final quality pass ===== */
:root {
  --primary-strong: color-mix(in srgb, var(--primary) 78%, #17204d);
  --primary-soft: color-mix(in srgb, var(--primary) 12%, var(--surface));
  --brand-purple: #8e75e1;
  --brand-mint: #62c7bd;
  --motion-fast: 160ms;
  --motion-mid: 320ms;
  --motion-slow: 620ms;
  --ease-spring: cubic-bezier(.2,.8,.2,1);
}
[data-theme="dark"] {
  --primary-strong: color-mix(in srgb, var(--primary) 72%, white);
  --primary-soft: color-mix(in srgb, var(--primary) 18%, var(--surface));
}
body { letter-spacing: -.012em; }
.app { background: var(--bg); }
.content { min-height: calc(100vh - var(--topbar-h)); }
.page-enter { animation: page-enter 360ms var(--ease-spring) both; }
@keyframes page-enter { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }

/* Approved ClovirAssist lockup. The original SVG is used without redrawing or recoloring. */
.brand-lockup { display:inline-flex; align-items:center; min-width:0; line-height:0; }
.brand-lockup > img { display:block; width:230px; max-width:100%; height:auto; object-fit:contain; background:transparent; }
.brand-lockup.is-compact > img { width:170px; }
.brand { min-width:214px; padding:5px 7px; }
.brand > .brand-lockup { pointer-events:none; }
.auth-logo .brand-lockup > img { width:225px; }
.auth-panel-logo .brand-lockup > img { width:190px; }
.auth-mobile-brand .brand-lockup > img { width:190px; }

/* Top chrome uses the same accent family as login, with runtime accent support. */
.topbar {
  background:
    radial-gradient(circle at 82% -40%, color-mix(in srgb,var(--brand-purple) 72%,transparent), transparent 42%),
    linear-gradient(105deg, color-mix(in srgb,var(--primary) 72%,#17204d) 0%, color-mix(in srgb,var(--primary) 58%,#327c98) 52%, color-mix(in srgb,var(--primary) 62%,var(--brand-purple)) 100%);
}
.top-search { height:40px; display:flex; align-items:center; max-width:720px; padding:0 10px 0 42px; border:1px solid rgba(255,255,255,.24); border-radius:12px; background:rgba(7,12,34,.22); color:#fff; cursor:pointer; text-align:left; }
.top-search:hover { background:rgba(7,12,34,.3); }
.top-search-placeholder { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:rgba(255,255,255,.82); font-size:13px; }
.top-search .search-ico { top:9px; }
.top-search .kbd { position:static; margin-left:12px; }

/* Official Clovi state poses share the same 1024px canvas and transition without changing identity or scale. */
.mascot-mini { position:relative; display:inline-grid; place-items:center; width:48px; height:48px; flex:0 0 auto; isolation:isolate; }
.mascot-mini img { position:relative; z-index:2; width:100%; height:100%; object-fit:contain; border-radius:14px; background:rgba(255,255,255,.95); animation:mascot-pose-in 260ms var(--ease-spring) both; transform-origin:50% 84%; }
.mascot-mini-ring { position:absolute; z-index:0; inset:-4px; border:2px solid color-mix(in srgb,var(--primary) 42%,transparent); border-radius:18px; opacity:.55; }
.mascot-mini-status { position:absolute; z-index:3; right:-3px; bottom:-3px; width:14px; height:14px; border:2px solid var(--surface); border-radius:50%; background:var(--success); }
.mascot-mini.is-listening .mascot-mini-ring { animation: mascot-listen 1.8s ease-out infinite; }
.mascot-mini.is-thinking .mascot-mini-ring,
.mascot-mini.is-responding .mascot-mini-ring { border-style:dashed; border-color:var(--primary); animation: mascot-spin 1.2s linear infinite; opacity:1; }
.mascot-mini.is-thinking .mascot-mini-status,
.mascot-mini.is-responding .mascot-mini-status { background:var(--warning); animation: mascot-status-pulse .8s ease-in-out infinite; }
.mascot-mini.is-success .mascot-mini-ring { border-color:var(--success); animation: mascot-success .72s var(--ease-spring) both; opacity:1; }
.mascot-mini.is-success .mascot-mini-status { background:var(--success); box-shadow:0 0 0 5px color-mix(in srgb,var(--success) 18%,transparent); }
.mascot-mini.is-error .mascot-mini-ring { border-color:var(--danger); opacity:1; animation: mascot-error .34s ease both; }
.mascot-mini.is-error .mascot-mini-status { background:var(--danger); }
@keyframes mascot-listen { 0%{transform:scale(.94);opacity:.75} 70%,100%{transform:scale(1.18);opacity:0} }
@keyframes mascot-spin { to { transform:rotate(360deg); } }
@keyframes mascot-status-pulse { 50% { transform:scale(.72); opacity:.62; } }
@keyframes mascot-success { 0%{transform:scale(.76);opacity:0} 60%{transform:scale(1.12);opacity:1} 100%{transform:scale(1)} }
@keyframes mascot-error { 30%{transform:translateX(-2px)} 65%{transform:translateX(2px)} }
@keyframes mascot-pose-in { from{opacity:.2;transform:translateY(3px) scale(.97)} to{opacity:1;transform:none} }
.mascot-mini.is-responding img,.mascot-mini.is-talking img { animation:mascot-talk 780ms ease-in-out infinite; }
.mascot-mini.is-success img,.mascot-mini.is-happy img,.mascot-mini.is-wave img { animation:mascot-celebrate 900ms var(--ease-spring) both; }
.mascot-mini.is-thinking img { animation:mascot-think 1.8s ease-in-out infinite; }
.mascot-mini.is-error img { animation:mascot-error-pose 420ms ease both; }
@keyframes mascot-talk { 50%{transform:translateY(-2px) rotate(-.7deg)} }
@keyframes mascot-celebrate { 0%{opacity:.2;transform:translateY(7px) scale(.95)} 55%{transform:translateY(-3px) scale(1.025)} 100%{opacity:1;transform:none} }
@keyframes mascot-think { 50%{transform:translateY(-2px) rotate(1deg)} }
@keyframes mascot-error-pose { 25%{transform:translateX(-2px)} 60%{transform:translateX(2px)} }
.state-mascot { position:relative; display:inline-grid; place-items:center; width:190px; height:190px; isolation:isolate; }
.state-mascot img { position:relative; z-index:2; width:100%; height:100%; object-fit:contain; animation:mascot-pose-in 320ms var(--ease-spring) both; }
.state-mascot-glow { position:absolute; z-index:0; inset:24%; border-radius:50%; background:radial-gradient(circle,color-mix(in srgb,var(--primary) 28%,transparent),transparent 70%); filter:blur(14px); animation:home-halo 3.2s ease-in-out infinite; }
.state-mascot.is-thinking img { animation:mascot-think 1.8s ease-in-out infinite; }
.state-mascot.is-error img { animation:mascot-error-pose 420ms ease both; }

.ai-fab { display:grid; place-items:center; overflow:visible; transition:transform var(--motion-mid) var(--ease-spring),box-shadow var(--motion-mid) ease; }

function setRoute(route){
  state.route=route; state.sidebar=false;
  if(route.startsWith('admin/')) state.mode='admin'; else if(!route.startsWith('state-')) state.mode='user';
  location.hash = '#/' + route;
  render();
}
function statusChip(status){
  const cls = status==='완료'?'ok':status==='검증'?'info':status==='계획'?'':status==='이슈'?'danger':status==='진행'?'purple':'warn';
  return `<span class="chip ${cls}">${status}</span>`;
}
function priorityChip(p){
  const cls = p==='긴급'?'danger':p==='높음'?'warn':p==='보통'?'info':'';
  return `<span class="chip ${cls}">${p}</span>`;
}

}

function applyAccessibilityNames(){
  document.querySelectorAll('button').forEach((el)=>{
    const hasName=(el.getAttribute('aria-label')||el.getAttribute('title')||el.textContent||'').trim();
    if(hasName) return;
    if(el.closest('.chat-compose')) el.setAttribute('aria-label','파일 첨부');
    else if(el.closest('td')) el.setAttribute('aria-label','상세 열기');
    else el.setAttribute('aria-label','동작 실행');
  });
  document.querySelectorAll('input,select,textarea').forEach((el)=>{
    if((el.labels&&el.labels.length)||el.getAttribute('aria-label')||el.getAttribute('aria-labelledby')||el.getAttribute('title')||el.getAttribute('placeholder')) return;
    const container=el.closest('.setting-row,.form-field,.card,.toolbar,.scope-bar');
    const nearby=container?.querySelector('strong,.form-label,.card-title,.k-field-label');
    let label=(nearby?.textContent||'').trim();
    if(!label && el.tagName==='SELECT') label=(el.options?.[el.selectedIndex]?.textContent||'선택').trim();
    if(!label && el.type==='date') label='날짜';
    if(!label && el.tagName==='TEXTAREA') label='내용';
    if(!label) label='입력';
    el.setAttribute('aria-label',label);
  });
}
function bindLoginMascot(){
  const stage=document.getElementById('auth-clovi-stage');
  if(!stage) return;
  let raf=0;
  const setEyes=(x=0,y=0)=>{stage.style.setProperty('--eye-x',`${x}px`);stage.style.setProperty('--eye-y',`${y}px`);};
  const updateMode=(mode)=>{stage.dataset.state=mode;const msg=document.getElementById('auth-clovi-message');if(msg){msg.textContent=mode==='email'?'이메일을 확인하고 있어요':mode==='privacy'?'비밀번호는 화면에 보이지 않게 지켜볼게요':mode==='loading'?'업무 공간에 연결하고 있어요':mode==='success'?'로그인했어요. 업무 공간을 여는 중이에요':mode==='error'?'입력한 내용을 다시 확인해 주세요':'오늘 업무를 준비했어요';}if(mode==='email')setEyes(4,1);else if(mode==='privacy')setEyes(-4,0);else if(mode==='error')setEyes(-2,1);else if(mode!=='idle')setEyes(0,0);};
  stage.__setMode=updateMode;
  const pointer=(e)=>{if(e.pointerType&&e.pointerType!=='mouse'&&e.pointerType!=='pen')return;if(stage.dataset.state!=='idle'&&stage.dataset.state!=='welcome')return;if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const r=stage.getBoundingClientRect();const nx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width*.59))/Math.max(innerWidth*.44,1)));const ny=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height*.235))/Math.max(innerHeight*.48,1)));setEyes((nx*4).toFixed(2),(ny*2.5).toFixed(2));});};
  window.addEventListener('pointermove',pointer,{passive:true,once:false});
  stage.__cleanup=()=>window.removeEventListener('pointermove',pointer);
  window.__loginPointerCleanup=stage.__cleanup;
  setTimeout(()=>{if(stage.isConnected&&stage.dataset.state==='welcome'){stage.dataset.state='idle';}},780);
  const scheduleBlink=()=>{const wait=2600+Math.random()*3000;window.__blinkTimer=setTimeout(()=>{if(stage.isConnected&&['idle','welcome','email'].includes(stage.dataset.state)){stage.classList.add('is-blinking');setTimeout(()=>stage.classList.remove('is-blinking'),160);}scheduleBlink();},wait);};
  clearTimeout(window.__blinkTimer);scheduleBlink();
  const email=document.getElementById('login-email');const pass=document.getElementById('login-password');
  email?.addEventListener('focus',()=>updateMode('email'));email?.addEventListener('blur',()=>updateMode('idle'));
  pass?.addEventListener('focus',()=>updateMode('privacy'));pass?.addEventListener('blur',()=>updateMode('idle'));
}

}

    form.addEventListener('submit',e=>{e.preventDefault();const email=document.getElementById('login-email');const pass=document.getElementById('login-password');const ee=document.getElementById('login-email-error');const pe=document.getElementById('login-password-error');let bad=false;const value=email?.value.trim()||'';if(!value){ee.textContent='회사 이메일을 입력해 주세요.';bad=true;}else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)){ee.textContent='이메일 형식을 확인해 주세요.';bad=true;}else ee.textContent='';if(!pass?.value){pe.textContent='비밀번호를 입력해 주세요.';bad=true;}else pe.textContent='';if(bad){state.notice='';document.getElementById('auth-clovi-stage')?.__setMode?.('error');(ee.textContent?email:pass)?.focus();return;}state.loading=true;state.notice='loading';render();setTimeout(()=>{state.loading=false;state.notice='success';render();showLoginConfetti();setTimeout(()=>{state.notice='';state.mode='user';setRoute('home');},1050);},780);});

  const commandInput=document.getElementById('command-input');if(commandInput)commandInput.addEventListener('input',()=>{const q=commandInput.value.toLowerCase();document.querySelectorAll('.command-item').forEach(el=>{el.hidden=q&&!el.textContent.toLowerCase().includes(q);});});
}
window.addEventListener('hashchange',()=>{state.route=location.hash.replace(/^#\/?/,'')||'login';state.mode=state.route.startsWith('admin/')?'admin':state.mode;render();});
window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(state.route!=='login'){state.command=!state.command;render();}}
  if(e.key==='Escape'){if(state.command||state.ai||state.sidebar){state.command=false;state.ai=false;state.sidebar=false;render();}}
});
render();
window.__clovirQA = {
  set(route, theme){ state.route=route; state.theme=theme || state.theme; state.mode=route.startsWith('admin/')?'admin':(route.startsWith('state-')?state.mode:'user'); state.command=false; state.ai=false; state.sidebar=false; render(); },
  setAssistantPhase(phase, route='home'){ state.route=route; state.mode=route.startsWith('admin/')?'admin':'user'; state.ai=true; state.aiPhase=phase; state.command=false; state.sidebar=false; render(); },
  setLoginState(mode){ state.route='login'; state.loading=mode==='loading'; state.notice=mode==='loading'?'loading':mode==='success'?'success':mode==='error'?'error':''; render(); const stage=document.getElementById('auth-clovi-stage'); stage?.__setMode?.(mode); },
  setLoginEyes(x,y){ const stage=document.getElementById('auth-clovi-stage'); if(stage){ stage.style.setProperty('--eye-x',`${x}px`); stage.style.setProperty('--eye-y',`${y}px`); } },
  state, render
};
</script></body></html>
