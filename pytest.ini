[pytest]
testpaths = tests
addopts = -m "not smoke" -q
markers =
    notion_source: 저장소 소스를 Notion 경로로 되돌려 놓고 도는 시험 (S14 · 되돌리기 창).
        제품 기본은 `native` 다 — 이 표가 붙은 파일은 **Notion 을 걷어낼 때 함께
        지우거나 다시 쓸 목록**이다. `tickets=` · `documents=` 로 값을 지정할 수 있다
    unit: fast isolated tests
    integration: API-level tests against the app factory
    security: security-focused tests
    regression: regression tests pinned to fixed defects
    smoke: tests that require a live running instance (deselected by default)
    real_db: 전용 PostgreSQL DB 가 필요한 시험 (D-190 2계층). 커넥션이 여럿이거나
        별도 프로세스를 띄우거나 DDL 을 돌리는 시험 — 공유 DB + 트랜잭션 되감기로는
        다른 커넥션이 이 시험의 데이터를 못 봐서 거짓 초록이 된다
