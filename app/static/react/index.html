<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#536CD6" />
    <title>ClovirAssist</title>
    <!--
      파비콘은 /static/brand/** 에 있다(app/static/brand). Vite의 base가 /static/react/ 라
      상대 경로로 두면 /static/react/... 로 다시 쓰인다. 절대 경로 + data-vite-ignore 없이
      안전하게 두려고 런타임 주입 대신 절대 URL을 그대로 쓴다. 빌드 산출물에서 경로가
      바뀌지 않는지 scripts/ui_qa 및 tests/regression/test_favicon_wiring.py가 확인한다.
    -->
    <link rel="icon" href="/static/brand/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/static/brand/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/brand/site.webmanifest" />
    <!--
      Pretendard 가변 폰트 (2026-08-04 사용자 지시로 CDN·웹폰트 허용).
      동적 서브셋이라 unicode-range 로 92조각에 나뉘어 있고, 브라우저가 화면에 실제로 쓰인
      글자 범위만 받는다. preconnect 를 먼저 두는 이유: 폰트 CSS 를 받고 나서야 woff2 요청이
      시작되므로, 연결 수립을 미리 해 두지 않으면 첫 화면에서 글꼴이 늦게 바뀐다.
      theme.js 의 fontFamily 뒤에 시스템 스택이 폴백으로 남아 있어, 이 요청이 실패해도
      화면은 예전과 같이 보인다.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <script type="module" crossorigin src="/static/react/assets/index.AbEdaNV8.js"></script>
    <link rel="modulepreload" crossorigin href="/static/react/assets/react.DC90WV7q.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/query.KXpqYlkq.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/vendor.CQ3mkMrG.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/mui.BsuNCYyi.js">
    <link rel="stylesheet" crossorigin href="/static/react/assets/style.CTqJMrBn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
