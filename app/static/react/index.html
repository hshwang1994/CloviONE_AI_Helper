<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#536CD6" />
    <title>ClovirAssist</title>
    <!--
      파비콘은 /static/brand/** 에 있다(app/static/brand). Vite의 base가 /static/react/ 라
      상대 경로로 두면 /static/react/... 로 다시 쓰인다. 절대 경로 + data-vite-ignore 없이
      안전하게 두려고 런타임 주입 대신 절대 URL을 그대로 쓴다. 빌드 산출물에서 경로가
      바뀌지 않는지 scripts/ui_qa 및 tests/regression/test_favicon_wiring.py가 확인한다.
    -->
    <link rel="icon" href="/static/brand/favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/static/brand/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/static/brand/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/static/brand/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/static/brand/site.webmanifest" />
    <!--
      Pretendard 가변 폰트 — **자체 호스팅**(2026-08-05).
      동적 서브셋이라 unicode-range 로 92조각에 나뉘어 있고, 브라우저가 화면에 실제로 쓰인
      글자 범위만 받는다. theme.js 의 fontFamily 뒤에 시스템 스택이 폴백으로 남아 있어,
      이 요청이 실패해도 화면은 예전과 같이 보인다.

      예전에는 jsdelivr 에서 받았다(2026-08-04 사용자 지시로 CDN 허용). 그런데 그 주소가
      `@v1.3.9` — **불변 해시가 아니라 git 태그**이고 `integrity=` 도 없었다. 태그는 옮길 수
      있으므로, CDN 이나 업스트림 저장소가 한 번 손상되면 우리가 매기는 CSS 가 조용히 바뀐다.
      npm 의 `pretendard` 패키지에 같은 파일이 이미 들어 있어서 app/static/fonts 로 옮겼다 —
      SRI 를 붙이는 것보다 나은 답이다(외부 요청 자체가 없어져서 오프라인·폐쇄망에서도 뜬다).
      이 덕분에 CSP 의 connect-src 를 'self' 로 되돌릴 수 있었다(app/core/middleware.py 참조).
    -->
    <link rel="stylesheet" href="/static/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <script type="module" crossorigin src="/static/react/assets/index.DMAxEftd.js"></script>
    <link rel="modulepreload" crossorigin href="/static/react/assets/react.Zb0QuSBE.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/query.DbBui2HC.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/emotion.C3vBTfNp.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/kit.DdogZxbS.js">
    <link rel="modulepreload" crossorigin href="/static/react/assets/datascreen.4b_2v2cr.js">
    <link rel="stylesheet" crossorigin href="/static/react/assets/style.BFRnPnIO.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
